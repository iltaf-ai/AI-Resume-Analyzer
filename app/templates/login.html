
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - AI Resume Analyzer</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/login.css') }}"
    >
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                AI Resume Analyzer
            </div>

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to analyze your resume
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    id="loginBtn"
                >
                    Login
                </button>

            </form>

            <p id="message"></p>

            <p class="login-link">
                Don't have an account?
                <a href="/register">Create Account</a>
            </p>

        </div>

    </div>

    <script
        src="{{ url_for('static', path='js/auth.js') }}"
    ></script>

</body>
</html>
