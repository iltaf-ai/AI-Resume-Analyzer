
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - AI Resume Analyzer</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/register.css') }}"
    >
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                AI Resume Analyzer
            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Start analyzing your resume with AI
            </p>

            <form id="registerForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    id="registerBtn"
                >
                    Create Account
                </button>

            </form>

            <p id="message"></p>

            <p class="login-link">
                Already have an account?
                <a href="/login">Login</a>
            </p>

        </div>

    </div>

    <script
        src="{{ url_for('static', path='js/auth.js') }}"
    ></script>

</body>
</html>
